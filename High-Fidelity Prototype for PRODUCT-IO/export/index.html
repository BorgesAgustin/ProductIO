<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODUCT-IO — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <!-- =============================================
       LOGIN PAGE
       ============================================= -->
  <main class="login-page">

    <div class="login-card">

      <!-- Logo -->
      <div class="login-card__logo">
        <div class="login-card__logo-mark">PIO</div>
        <div class="login-card__logo-text">
          <div class="login-card__logo-name">PRODUCT-IO</div>
          <div class="login-card__logo-company">Papelera K&amp;A</div>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="login-card__heading">Bienvenido</h1>
      <p class="login-card__sub">Ingrese sus credenciales para continuar</p>

      <!-- Error message (shown by JS) -->
      <div id="login-error" class="login-card__error" role="alert">
        Usuario o contraseña incorrectos.
      </div>

      <!-- Form -->
      <form id="login-form" class="login-card__form" novalidate>

        <div class="form-field">
          <label class="form-field__label form-field__label--required" for="username">
            Usuario
          </label>
          <input
            id="username"
            name="username"
            type="text"
            class="form-field__input"
            placeholder="usuario@empresa.com"
            autocomplete="username"
            required>
        </div>

        <div class="form-field">
          <label class="form-field__label form-field__label--required" for="password">
            Contraseña
          </label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-field__input"
            placeholder="••••••••"
            autocomplete="current-password"
            required>
        </div>

        <button type="submit" class="btn btn--primary btn--lg" style="width:100%">
          Iniciar sesión
        </button>

      </form>

    </div>

  </main>

  <!-- Toast -->
  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    /* Login logic — demo: any non-empty credentials succeed */
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value.trim();
      var errorEl = document.getElementById('login-error');

      if (!user || !pass) {
        errorEl.classList.add('login-card__error--visible');
        return;
      }

      errorEl.classList.remove('login-card__error--visible');

      /* Persist a minimal session object for other pages */
      var roleMap = {
        'operario':    { name: 'Carlos Rodríguez', role: 'operator' },
        'calidad':     { name: 'Ana Torres',        role: 'quality'  },
        'mantenimiento':{ name: 'Luis Herrera',     role: 'maintenance' },
        'contador':    { name: 'María Gómez',       role: 'accountant' },
        'gerente':     { name: 'Roberto Silva',     role: 'manager'  },
        'admin':       { name: 'Admin Sistema',     role: 'admin'    }
      };
      var session = roleMap[user.toLowerCase()] || { name: user, role: 'operator' };
      localStorage.setItem('productio_user', JSON.stringify(session));

      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
